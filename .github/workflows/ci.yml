# CI 流水线（GitHub Actions）
# 阶段：质量门禁（格式、静态检查、架构规则、单元 + 集成测试）→ 依赖检查 → 构建镜像 → 镜像扫描 → 推送到 GHCR
# 原则：一次构建、处处使用。镜像里的 jar 就是 verify 任务测过的那一份，image 任务不重新打包
# 这是公开的练习仓库：verify 自动运行；image 只能手动触发，避免每次推送都生成公开镜像
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      # verify 一条命令跑完：enforcer → 编译 → 单元测试 → 打包 → 集成测试 → Spotless 检查 → SpotBugs → JaCoCo 报告
      - name: 质量门禁
        run: ./mvnw -B verify
      - name: 依赖发布满两周
        run: python3 -I scripts/check-dependency-age.py 14
      # import 的 BOM 会静默覆盖 Boot 用 import 管理的版本（Spring Cloud Alibaba 就降过 log4j），有覆盖就失败
      - name: import 的 BOM 没有改掉 Boot 管理的版本
        run: python3 -I scripts/check-bom-overrides.py
      # ConfigMap 是 config/ 的生成物：重新生成后有差异，说明有人只改了一边
      - name: K8s ConfigMap 与 config/ 一致
        run: scripts/gen-k8s-configmap.sh && git diff --exit-code deploy/k8s/01-configmap.yaml
      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/target/*-reports/"
      # 只有 main 才需要镜像：把测过的可执行 jar 交给 image 任务
      - name: 上传可执行 jar
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: service-jars
          path: "*/target/*.jar"
          retention-days: 1

  image:
    needs: verify
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # 推送到 GitHub 自带的镜像仓库需要 packages 写权限，只在这个任务里给
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [gateway, auth-service, user-service, product-service, inventory-service, order-service]
    env:
      IMAGE: ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      # 不重新打包：下载 verify 任务产出的 jar，目录结构（<服务>/target/*.jar）和本地一致，Dockerfile 不用改
      - uses: actions/download-artifact@v4
        with:
          name: service-jars
      # 镜像标签用提交号：一次构建，测试、预发、生产用同一个镜像，只换配置
      - name: 构建镜像
        run: docker build -f ${{ matrix.service }}/Dockerfile -t "$IMAGE" .
      # 镜像漏洞扫描：高危漏洞直接让流水线失败，失败的镜像不会被推送
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}
          severity: CRITICAL,HIGH
          exit-code: "1"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 推送镜像
        run: docker push "$IMAGE"
