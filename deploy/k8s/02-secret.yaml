# 敏感配置。这里的值只是演示占位符，真实环境由 CI/CD 或 External Secrets / Vault 注入，绝不提交到代码仓库。
# 按"谁用谁拿"拆成三份：每个 Deployment 只引用自己需要的 Secret，用户服务拿不到订单服务的客户端密钥。
# JWT 签名密钥单独一份（认证服务多副本时必须共用同一对密钥），生成方法：
#   openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out private.pem
#   openssl rsa -in private.pem -pubout -out public.pem
#   kubectl create secret generic ms-jwt -n ms --from-file=private.pem --from-file=public.pem

# 数据库账号：用到 MySQL 的服务（网关不连数据库）
apiVersion: v1
kind: Secret
metadata:
  name: ms-db
  namespace: ms
type: Opaque
stringData:
  MYSQL_USER: ms
  MYSQL_PASSWORD: change-me
---
# 订单服务换服务令牌用的客户端密钥：订单服务（用它换令牌）和认证服务（校验它）
apiVersion: v1
kind: Secret
metadata:
  name: ms-client-order-service
  namespace: ms
type: Opaque
stringData:
  ORDER_SERVICE_CLIENT_SECRET: change-me-order
---
# 商品服务换服务令牌用的客户端密钥：商品服务（含灰度版）和认证服务
apiVersion: v1
kind: Secret
metadata:
  name: ms-client-product-service
  namespace: ms
type: Opaque
stringData:
  PRODUCT_SERVICE_CLIENT_SECRET: change-me-product
