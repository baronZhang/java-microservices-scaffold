# 用户服务。公共配置在 config/ms-common.yml
server:
  port: ${PORT:9082}

spring:
  application:
    name: user-service
  config:
    # 公共配置；服务自己的动态配置（config/<服务名>.yml 或 Nacos 里的 <服务名>.yaml）由 ms-common.yml 按 profile 决定从哪里加载
    import: optional:file:${MS_CONFIG_DIR:./config}/ms-common.yml
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false

ms:
  db:
    name: user
